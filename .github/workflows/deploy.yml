name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          preCommands: |
            mkdir -p /tmp/deploy
            rsync -a --exclude='.git/' --exclude='node_modules/' --exclude='.github/' --exclude='*.md' --exclude='*.toml' --exclude='*.txt' . /tmp/deploy/
          command: deploy --assets /tmp/deploy
