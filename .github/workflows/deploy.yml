name: Deploy to Cloudflare Workers
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepara assets puliti
        run: |
          mkdir -p /tmp/site-assets/assets
          cp *.html /tmp/site-assets/
          cp assets/* /tmp/site-assets/assets/
          cp wrangler.toml /tmp/site-assets/
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          workingDirectory: /tmp/site-assets
          command: deploy --compatibility-date 2026-06-17 --name fiche-technique-pro
