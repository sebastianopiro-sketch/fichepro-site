name: Deploy to Cloudflare Workers
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepara assets puliti
        run: |
          mkdir -p /tmp/site-assets/assets
          cp *.html /tmp/site-assets/
          cp assets/* /tmp/site-assets/assets/
      - name: Installa Wrangler globalmente
        run: npm install -g wrangler@4
      - name: Deploy su Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --assets /tmp/site-assets --compatibility-date 2026-06-17 --name fiche-technique-pro
